# Ordered Hugging Face fallback policy for current and future repository AI consumers.
# Keep model IDs and labels paired; consumers must try entries in this exact order.
# max_output_tokens is a ceiling only; models may complete with fewer tokens.
summary:
  max_output_tokens: 800

output_policy:
  format: markdown
  direct_insert: true
  prohibit_nested_markdown: true
  prohibit_markdown_code_fences: true
  prohibit_preamble: true
  prohibit_postscript: true

models:
  - id: hf-gpt-oss-120b
    label: Hugging Face GPT-OSS 120B
    model: openai/gpt-oss-120b:cheapest
  - id: gpt-oss-20b
    label: GPT-OSS 20B
    model: openai/gpt-oss-20b:fastest
  - id: nemotron-3-nano-30b-a3b-bf16
    label: NVIDIA Nemotron 3 Nano 30B A3B BF16
    model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16:featherless-ai
  - id: minimax-m2-5
    label: MiniMax M2.5
    model: MiniMaxAI/MiniMax-M2.5:cheapest
