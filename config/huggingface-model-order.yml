# Ordered Hugging Face fallback policy for current and future repository AI consumers.
# Keep model IDs and labels paired; consumers must try entries in this exact order.
# max_output_tokens is a ceiling only; models may complete with fewer tokens.
summary:
  max_output_tokens: 800

output_policy:
  format: markdown
  direct_insert: true
  prohibit_nested_markdown: true
  prohibit_markdown_code_fences: true
  prohibit_preamble: true
  prohibit_postscript: true

models:
  - id: apertus-v1-5-70b
    label: Apertus v1.5 70B
    model: swiss-ai/Apertus-v1.5-70B:featherless-ai
  - id: llama-3-1-nemotron-70b-instruct-hf
    label: Llama 3.1 Nemotron 70B Instruct HF
    model: nvidia/Llama-3.1-Nemotron-70B-Instruct-HF:featherless-ai
  - id: gemma-4-31b-it
    label: Gemma 4 31B IT
    model: google/gemma-4-31B-it:fastest
